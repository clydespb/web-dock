<!DOCTYPE html>
<html lang="ru" data-type="engineering">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, follow">
    <meta name="theme-color" content="#080808">

    <title>Страница не найдена — WEB•DOCK</title>

    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="apple-touch-icon" href="/assets/img/icon-192.png">

    <link rel="stylesheet" href="/assets/css/style.css?v=20261030">

    <style>
        .nf{
            position:relative;
            min-height:100vh;
            display:flex;
            align-items:center;
            padding:150px 0 90px;
            overflow:hidden;
        }

        .nf::before{
            content:"";
            position:absolute;
            inset:0;
            pointer-events:none;
            background-image:
                linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px);
            background-size:56px 56px;
            -webkit-mask-image:radial-gradient(ellipse 70% 60% at 30% 50%, #000 25%, transparent 80%);
            mask-image:radial-gradient(ellipse 70% 60% at 30% 50%, #000 25%, transparent 80%);
        }

        .nf::after{
            content:"";
            position:absolute;
            width:70vw;
            height:70vw;
            max-width:900px;
            max-height:900px;
            right:-15vw;
            top:50%;
            transform:translateY(-50%);
            border-radius:50%;
            background:
                radial-gradient(circle at 40% 45%, rgba(79,140,255,.18) 0%, transparent 55%),
                radial-gradient(circle at 60% 60%, rgba(240,164,92,.12) 0%, transparent 55%);
            filter:blur(60px);
            pointer-events:none;
        }

        .nf__inner{
            position:relative;
            z-index:1;
        }

        .nf__code{
            display:block;
            font-family:var(--font-display);
            font-weight:600;
            font-size:clamp(150px,28vw,380px);
            line-height:.82;
            letter-spacing:-.01em;
            background:linear-gradient(180deg, rgba(255,255,255,.92) 0%, rgba(255,255,255,.08) 100%);
            -webkit-background-clip:text;
            background-clip:text;
            color:transparent;
            animation:heroRise .9s cubic-bezier(.22,1,.36,1) both;
        }

        .nf h1{
            margin-top:28px;
            font-family:var(--font-display);
            font-weight:var(--display-weight);
            text-transform:var(--display-transform);
            letter-spacing:var(--display-tracking);
            line-height:var(--display-leading);
            font-size:calc(clamp(34px,4vw,52px) * var(--display-scale));
            animation:heroRise .9s cubic-bezier(.22,1,.36,1) .15s both;
        }

        .nf p{
            margin-top:20px;
            max-width:520px;
            color:var(--gray);
            font-size:18px;
            line-height:1.7;
            animation:heroRise .9s cubic-bezier(.22,1,.36,1) .3s both;
        }

        .nf__buttons{
            display:flex;
            flex-wrap:wrap;
            gap:16px;
            margin-top:40px;
            animation:heroRise .9s cubic-bezier(.22,1,.36,1) .45s both;
        }

        @media (max-width:576px){
            .nf{ padding:120px 0 64px; }
            .nf__buttons .button{ width:100%; }
        }
    </style>

</head>

<body>

<div class="noise"></div>

<header class="header">
    <div class="container">
        <a href="/" class="logo">WEB<span>•</span>DOCK</a>
        <a href="/#contacts" class="button button--header">Обсудить проект</a>
    </div>
</header>

<main class="nf">
    <div class="container nf__inner">

        <span class="nf__code" aria-hidden="true">404</span>

        <h1>Эта страница уплыла.</h1>

        <p>
            Такой страницы нет: возможно, ссылка устарела или в адресе опечатка.
            Возвращайтесь в док — всё остальное на месте.
        </p>

        <div class="nf__buttons">
            <a href="/" class="button">На главную</a>
            <a href="https://t.me/clydespb" class="button button--ghost" target="_blank" rel="noopener noreferrer">
                <svg class="button__icon" width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                    <path fill-rule="evenodd" clip-rule="evenodd" d="M2.5 11.3 20.3 4.3c.9-.3 1.8.5 1.5 1.5l-3 14.6c-.2 1.1-1.5 1.5-2.3.8l-4.4-3.5-2.3 2.4c-.5.5-1.4.3-1.6-.4l-1.2-4.5-4.2-1.5c-1-.4-1.1-1.9-.3-2.4Zm5.9 5.1 1 3.6.9-2.5c.1-.4.3-.7.6-.9l6.7-5.5c.3-.2 0-.7-.3-.5l-8.1 5.1c-.5.3-.7.4-.8.7Z" fill="currentColor"/>
                </svg>
                Написать в Telegram
            </a>
        </div>

    </div>
</main>

</body>
</html>
