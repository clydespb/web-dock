name: Деплой на Джино

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Получить код
        uses: actions/checkout@v6

      - name: Установить lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Загрузить файлы по SFTP
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          cat > /tmp/deploy.lftp <<EOF
          set sftp:auto-confirm yes
          set cmd:fail-exit yes
          set net:timeout 20
          set net:max-retries 6
          set net:reconnect-interval-base 10
          set net:reconnect-interval-multiplier 2
          set net:reconnect-interval-max 60
          open --env-password -u "$FTP_USERNAME" sftp://$FTP_SERVER:2222
          pwd
          cls -1
          mirror --reverse --verbose --exclude-glob .git*/ --exclude-glob .git* --exclude-glob README.md --exclude-glob CLAUDE.md ./ ./
          EOF
          lftp -f /tmp/deploy.lftp
